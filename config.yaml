# --- 用户手册 ---
manual_zh: |
  ### 核心功能
  * **智能转换**：自动检测 C 函数，将其转换为带有中文注释的流程图。
  * **批量处理**：自动查找上传 ZIP 包中的所有 C 函数并批量转换为流程图。
  * **动态过滤**：使用侧边栏滑块，一键跳过简单的短函数。
  * **自动纠错**：当 PlantUML 语法出错时，AI 自动重试并尝试修复。
  * **任务管理**：支持异步后台执行，可手动取消任务。

  ### 使用流程
  1. **准备**：将你的 C 项目文件夹（如 `usr` 目录）压缩为 `.zip` 文件。
  2. **配置**：在左侧边栏选择 **AI 模型**，调整 **最大重试次数** 和 **跳过短函数** 滑块。
  3. **运行**：在 **"开始新任务"** 标签页，上传 ZIP 文件并点击 **"在后台开始分析"**。
  4. **监控**：切换到 **"任务监控"** 标签页查看实时日志，可随时点击 **"中止任务"** 停止。
  5. **交付**：任务完成后，点击 **"下载结果 (Zip)"** 获取所有 PNG 图片。

manual_en: |
  ### Core Features
  * **Smart Conversion**: Automatically detects C functions and converts them into flowcharts with English annotations.
  * **Batch Processing**: Automatically finds all C functions in the uploaded ZIP archive and converts them into flowcharts.
  * **Dynamic Filtering**: Use the sidebar slider to skip simple short functions with one click.
  * **Auto Correction**: When PlantUML syntax errors occur, the AI automatically retries and attempts to fix them.
  * **Task Management**: Supports asynchronous background execution and manual cancellation.

  ### Workflow
  1. **Prepare**: Compress your C project folder (e.g., the `usr` directory) into a `.zip` file.
  2. **Configure**: Select an **AI model** in the left sidebar, adjust **Max retries** and **Skip short functions** sliders.
  3. **Run**: In the **"Start a new task"** tab, upload the ZIP file and click **"Start analysis in background"**.
  4. **Monitor**: Switch to the **"Task monitor"** tab to view live logs, click **"Abort task"** to stop at any time.
  5. **Deliver**: After the task completes, click **"Download results (Zip)"** to get all PNG images.
