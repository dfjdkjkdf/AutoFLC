    2. **节点内容格式**：
       - 每个步骤**必须**单独占一行，不要在一行放置多个步骤。
       - 判断**必须**遵循PlantUML if语法，禁止使用 C 宏定义语法如"ifdef _INCLUDE_EDA_"；
       - 每个步骤必须包含 **中文意图总结** 和 **关键代码**；
       - **关键代码** **必须**精简到30个字符内，允许为**空**;
       - 格式示例：`: **初始化变量** int i = 0;`

    3. **语法知识提示**
       - if 判断**必须**遵循PlantUML if语法，禁止使用 C 宏定义语法如"ifdef _INCLUDE_EDA_"；
       - switch语句default分支**必须**写成 case(default)，禁止直接使用 default。

    4. **语法结构示例**：
       @startuml
       :开始;
       if (**指针为空** ptr == NULL) then (是)
           : **返回错误** return -1;
           :结束;
       else (否)
           : **执行逻辑** do_something();
       endif
       :结束;
       @enduml

    错误信息：{error_msg}
    原始代码：
    {code}

    请只返回修复后的 PlantUML 代码，不要包含 markdown 标记。

  fix_syntax_en: |
    The PlantUML code you generated has syntax errors. Please fix them.

    **Key style requirements (must be strictly followed)**:
    1. **Start and end node style**:
       - **Forbidden**: Do NOT use the default `start` and `stop` keywords (no filled circles).
